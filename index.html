<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giải pháp CRM cho đội Sales B2B</title>
<meta name="description" content="Solution design tương tác: hành trình quản lý khách hàng và bán hàng cho doanh nghiệp B2B SME có 10–15 nhân viên Sales, minh họa trên Base CRM.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#view">Bỏ qua điều hướng</a>

<header class="top">
  <a class="brand" href="#s-mo-dau" title="Về slide mở đầu">Giải pháp CRM</a>
  <nav class="journey" id="journey" aria-label="Hành trình khách hàng"></nav>
  <div class="top-r">
    <div class="mode" role="group" aria-label="Chế độ xem" id="modeSwitch">
      <button type="button" data-mode="s" aria-pressed="true">Trình bày</button>
      <button type="button" data-mode="d" aria-pressed="false">Chi tiết</button>
    </div>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<footer class="bar" id="bar">
  <button type="button" class="nav-btn" id="prev"><span aria-hidden="true">←</span> <span class="lbl">Trước</span></button>
  <div class="bar-mid">
    <a class="map-btn" href="#s-tong-quan" id="mapBtn">Sơ đồ hành trình</a>
    <span class="where" id="where" aria-live="polite"></span>
    <button type="button" class="ghost-btn" id="notesBtn" aria-pressed="false" aria-controls="notes" title="Phím N">Ghi chú người trình bày</button>
    <button type="button" class="ghost-btn" id="fsBtn" title="Phím F">Toàn màn hình</button>
    <nav class="extra" aria-label="Tài liệu người trình bày">
      <a href="#script" id="lnkScript">Kịch bản</a>
      <a href="#qa" id="lnkQa">Kiểm tra</a>
    </nav>
  </div>
  <button type="button" class="nav-btn primary" id="next"><span class="lbl">Tiếp</span> <span aria-hidden="true">→</span></button>
</footer>

<aside class="notes" id="notes" hidden aria-label="Ghi chú người trình bày">
  <div class="notes-h">
    <b id="notesTitle"></b>
    <span class="timer"><span id="timerVal">00:00</span> <button type="button" id="timerBtn">Bắt đầu</button> <button type="button" id="timerReset">Đặt lại</button></span>
    <button type="button" class="x" id="notesClose" aria-label="Đóng ghi chú">×</button>
  </div>
  <p class="notes-plan" id="notesPlan"></p>
  <ul id="notesList"></ul>
</aside>

<dialog class="lightbox" id="lightbox" aria-label="Ảnh phóng to">
  <form method="dialog"><button class="x" aria-label="Đóng ảnh">×</button></form>
  <div id="lbBody"></div>
</dialog>

<script src="js/content.js"></script>
<script src="js/qa-results.js"></script>
<script src="js/app.js"></script>
</body>
</html>
